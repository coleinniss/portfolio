var KEY = 'ci-unlock';
var dec = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
var form = document.getElementById('lock-form'), pw = document.getElementById('lock-pw'), keep = document.getElementById('lock-keep'),
    err = document.getElementById('lock-err'), go = document.getElementById('lock-go');
function open(text){ document.open(); document.write(text); document.close(); }
async function tryPassword(p){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:dec(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(P.iv)}, key, dec(P.data));
  return new TextDecoder().decode(out);
}
async function unlock(p, remember, silent){
  try {
    var text = await tryPassword(p);
    try { (remember ? localStorage : sessionStorage).setItem(KEY, p); } catch(e) {}
    open(text); return true;
  } catch(e) {
    if (!silent) { err.textContent = 'That password didn’t work. Check it and try again.'; pw.setAttribute('aria-invalid','true');
      pw.classList.remove('lock-shake'); void pw.offsetWidth; pw.classList.add('lock-shake'); pw.focus(); pw.select(); }
    return false;
  }
}
var saved = null; try { saved = sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch(e) {}
if (saved) unlock(saved, false, true).then(function(ok){ if (!ok) { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch(e) {} } });
form.addEventListener('submit', async function(e){
  e.preventDefault(); err.textContent = '';
  if (!pw.value) { err.textContent = 'Enter the password to continue.'; pw.setAttribute('aria-invalid','true'); pw.focus(); return; }

  var ok = await unlock(pw.value, keep.checked, false);
  if (!ok) { go.disabled = false; go.textContent = 'Unlock'; }
});
